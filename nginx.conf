# Configuração do Nginx de PRODUÇÃO (cópia de /usr/local/nginx/conf/nginx.conf).
# Nginx 1.26.0 compilado com OpenSSL 3.5.5 (suporte a troca de chaves pós-quântica).
# Este arquivo contém apenas caminhos de certificados; nenhuma chave ou senha.

#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Porta 80: validação do Certbot (webroot) e redirecionamento para HTTPS
    server {
        listen       80;
        server_name  projeto-aplicado-adriele.duckdns.org 68.155.155.179;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://projeto-aplicado-adriele.duckdns.org$request_uri;
        }
    }

    # Porta 443: TLS 1.2/1.3, curva híbrida pós-quântica e proxy para o Flask
    server {
        listen       443 ssl;
        server_name  projeto-aplicado-adriele.duckdns.org;

        ssl_certificate      /etc/letsencrypt/live/projeto-aplicado-adriele.duckdns.org/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/projeto-aplicado-adriele.duckdns.org/privkey.pem;

        ssl_protocols    TLSv1.2 TLSv1.3;

        # Curvas: híbrida pós-quântica (X25519MLKEM768) primeiro; clássicas como alternativa
        ssl_ecdh_curve   X25519MLKEM768:X25519:secp384r1;

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
name: Deploy Automático via CI/CD

on:
  push:
    branches: [ main ]

# Princípio do menor privilégio: o workflow só precisa ler o repositório.
permissions:
  contents: read

# Evita dois deploys ao mesmo tempo.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar acesso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Atualizar código e reconstruir o contêiner no servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes "$SSH_USER@$SSH_HOST" \
            'cd ~/projeto-aplicado-praticas-mercado && git fetch origin main && git reset --hard origin/main && sudo docker compose up -d --build --remove-orphans'

      - name: Verificar se a aplicação respondeu
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-connrefused -o /dev/null \
            https://projeto-aplicado-adriele.duckdns.org/login
          echo "Deploy concluído e aplicação respondendo."